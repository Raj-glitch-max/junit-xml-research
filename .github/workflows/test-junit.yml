name: JUnit XML Structure Research

on:
  push:
    branches: [main]

permissions:
  contents: read
  checks: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  structure-a:
    name: "Structure A - File per testsuite"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Report
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: "Structure A Results"
          path: samples/structure-a.xml
          reporter: java-junit
          fail-on-error: false

  structure-b:
    name: "Structure B - Flat single testsuite"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Report
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: "Structure B Results"
          path: samples/structure-b.xml
          reporter: java-junit
          fail-on-error: false

  structure-c:
    name: "Structure C - Combined name"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Report
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: "Structure C Results"
          path: samples/structure-c.xml
          reporter: java-junit
          fail-on-error: false
